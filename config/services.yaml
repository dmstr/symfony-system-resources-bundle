services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Registers the bundle's permissions through the plain string container
    # tag `za7_core.permission` (attribute `permission`). The tag is a plain
    # string on purpose: without za7-core nothing collects it, so it has no
    # effect and the bundle does not depend on za7-core.
    #
    # The service is only the carrier of the tags and is never instantiated:
    # it is private and unreferenced, za7-core's compiler pass reads the tags
    # before the optimization passes, and the container removes it afterwards.
    # That is why the private constructor of the class is fine. Autowiring is
    # off so that no compiler pass reflects on that constructor.
    Dmstr\SymfonySystemResources\Security\SystemResourcesPermissions:
        autowire: false
        autoconfigure: false
        tags:
            - { name: za7_core.permission, permission: 'sysres:messenger_read' }
            - { name: za7_core.permission, permission: 'sysres:migration_read' }
            - { name: za7_core.permission, permission: 'sysres:messenger_prune' }

    # Retention of Messenger messages per queue: REST operation, CLI mirror
    # and a message for the application's scheduler share the pruner.
    Dmstr\SymfonySystemResources\Service\MessengerMessagePruner: ~

    Dmstr\SymfonySystemResources\State\MessengerMessagePruneProcessor:
        tags: ['api_platform.state_processor']

    Dmstr\SymfonySystemResources\Command\PruneMessengerMessagesCommand:
        tags: ['console.command']

    Dmstr\SymfonySystemResources\MessageHandler\PruneMessengerMessagesHandler:
        tags: [messenger.message_handler]

    # Input schemas next to the entities (Entity/MessengerMessage/prune.input.json)
    # for the OpenAPI request body and the validation of REST and CLI input.
    dmstr_system_resources.input_schema_resolver:
        class: Dmstr\OpenApiJsonSchema\Service\OperationInputSchemaResolver
        arguments:
            $schemaBasePaths: []
            $entityResolutionRoots:
                - ['%dmstr_system_resources.dir%/src/Entity', 'Dmstr\SymfonySystemResources\Entity']
        tags:
            - { name: dmstr_openapi_json_schema.input_resolver, priority: 10 }
